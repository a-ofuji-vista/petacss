<div class="input-error">
  <input
    class="input-error__field js-input-error"
    id="input-error-field"
    type="text"
    placeholder="テキスト"
    aria-label="テキスト"
    aria-invalid="true"
    aria-describedby="input-error-message"
  />

    テキストを入力してください
  </p>
</div>
