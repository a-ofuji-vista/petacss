<div class="animation-section-pinned-scroll js-animation-section-pinned-scroll">
  <div class="animation-section-pinned-scroll__intro">
    <div class="animation-section-pinned-scroll__scroll-hint">
      <p class="animation-section-pinned-scroll__hint">
        スクロールすると画面が固定され、内容だけが切り替わります
      </p>
      <span class="animation-section-pinned-scroll__arrow" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path
            d="M4 6l4 4 4-4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </div>
  </div>

  <div
    class="animation-section-pinned-scroll__section"
    role="region"
    aria-label="固定スクロールギャラリー"
  >
    <div class="animation-section-pinned-scroll__viewport">
      <div class="animation-section-pinned-scroll__slides">
        <figure class="animation-section-pinned-scroll__slide">
          <div class="animation-section-pinned-scroll__media">
            <img
              class="animation-section-pinned-scroll__image"
              src="/snippets/card-sample-01.jpg"
              alt=""
              width="640"
              height="427"
              decoding="async"
            />
          </div>
          <figcaption class="animation-section-pinned-scroll__body">
            <span class="animation-section-pinned-scroll__index">01</span>
            <span class="animation-section-pinned-scroll__title"
              >タイトル 1</span
            >
            <span class="animation-section-pinned-scroll__text">
              ここに説明テキストが入ります。画面は固定されたまま、次の内容へ切り替わります。
            </span>
          </figcaption>
        </figure>
        <figure class="animation-section-pinned-scroll__slide">
          <div class="animation-section-pinned-scroll__media">
            <img
              class="animation-section-pinned-scroll__image"
              src="/snippets/card-sample-02.jpg"
              alt=""
              width="640"
              height="427"
              decoding="async"
            />
          </div>
          <figcaption class="animation-section-pinned-scroll__body">
            <span class="animation-section-pinned-scroll__index">02</span>
            <span class="animation-section-pinned-scroll__title"
              >タイトル 2</span
            >
            <span class="animation-section-pinned-scroll__text">
              ここに説明テキストが入ります。画像とテキストを差し替えて物語を進められます。
            </span>
          </figcaption>
        </figure>
        <figure class="animation-section-pinned-scroll__slide">
          <div class="animation-section-pinned-scroll__media">
            <img
              class="animation-section-pinned-scroll__image"
              src="/snippets/card-sample-03.jpg"
              alt=""
              width="640"
              height="427"
              decoding="async"
            />
          </div>
          <figcaption class="animation-section-pinned-scroll__body">
            <span class="animation-section-pinned-scroll__index">03</span>
            <span class="animation-section-pinned-scroll__title"
              >タイトル 3</span
            >
            <span class="animation-section-pinned-scroll__text">
              ここに説明テキストが入ります。固定フレームの中で次のシーンへフェードします。
            </span>
          </figcaption>
        </figure>
        <figure class="animation-section-pinned-scroll__slide">
          <div class="animation-section-pinned-scroll__media">
            <img
              class="animation-section-pinned-scroll__image"
              src="/snippets/card-sample-04.jpg"
              alt=""
              width="640"
              height="427"
              decoding="async"
            />
          </div>
          <figcaption class="animation-section-pinned-scroll__body">
            <span class="animation-section-pinned-scroll__index">04</span>
            <span class="animation-section-pinned-scroll__title"
              >タイトル 4</span
            >
            <span class="animation-section-pinned-scroll__text">
              ここに説明テキストが入ります。最後まで進むと固定が解除されます。
            </span>
          </figcaption>
        </figure>
      </div>
      <ol
        class="animation-section-pinned-scroll__progress"
        aria-hidden="true"
      ></ol>
    </div>
  </div>

  <div class="animation-section-pinned-scroll__outro"></div>
</div>

<script src="https://unpkg.com/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
