<div class="animation-scroll-zoom js-animation-scroll-zoom">
  <div class="animation-scroll-zoom__intro">
    <div class="animation-scroll-zoom__scroll-hint">
      <p class="animation-scroll-zoom__hint">
        スクロールすると画像が近づき、中央にテキストが表示されます
      </p>
      <span class="animation-scroll-zoom__arrow" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path
            d="M4 6l4 4 4-4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </div>
  </div>

  <div
    class="animation-scroll-zoom__section"
    role="region"
    aria-label="スクロールで近づく画像"
  >
    <div class="animation-scroll-zoom__viewport">
      <div class="animation-scroll-zoom__stage">
        <div class="animation-scroll-zoom__media">
          <img
            class="animation-scroll-zoom__image"
            src="/snippets/card-sample-01-lg.jpg"
            alt=""
            width="640"
            height="640"
            decoding="async"
          />
        </div>
        <div class="animation-scroll-zoom__overlay" aria-hidden="true"></div>
        <div class="animation-scroll-zoom__copy">
          <p class="animation-scroll-zoom__title">ここにタイトル</p>
          <p class="animation-scroll-zoom__text">
            スクロールに合わせて画像が近づき、中央にメッセージが現れます。
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="animation-scroll-zoom__outro"></div>
</div>

<script src="https://unpkg.com/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
