<div class="modal-basic-no-title js-modal-basic-no-title">
  <button
    class="modal-basic-no-title__open js-modal-basic-no-title-open"
    type="button"
  >
    モーダルを開く
  </button>

  <dialog
    class="modal-basic-no-title__dialog js-modal-basic-no-title-dialog"
    aria-label="モーダルダイアログ"
  >
    <div class="modal-basic-no-title__header">
      <button
        class="modal-basic-no-title__close js-modal-basic-no-title-close"
        type="button"
        aria-label="モーダルを閉じる"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 22 22"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M5 5l12 12M17 5L5 17"
            stroke="currentColor"
            stroke-width="1.8"
          />
        </svg>
      </button>
    </div>

    <p class="modal-basic-no-title__text">
      ここに説明テキストが入ります。ここに説明テキストが入ります。ここに説明テキストが入ります。
    </p>

    <div class="modal-basic-no-title__footer">
      <button
        class="modal-basic-no-title__button modal-basic-no-title__button--secondary js-modal-basic-no-title-close"
        type="button"
      >
        キャンセル
      </button>
      <button
        class="modal-basic-no-title__button modal-basic-no-title__button--primary js-modal-basic-no-title-close"
        type="button"
      >
        OK
      </button>
    </div>
  </dialog>
</div>
