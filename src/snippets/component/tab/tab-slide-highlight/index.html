<div class="tab-slide-highlight js-tab-slide-highlight">
  <div class="tab-slide-highlight__list" role="tablist" aria-label="タブ">
    <span
      class="tab-slide-highlight__indicator js-tab-slide-highlight-indicator"
      aria-hidden="true"
    ></span>
    <button
      class="tab-slide-highlight__tab js-tab-slide-highlight-tab tab-slide-highlight__tab--active"
      type="button"
      role="tab"
      aria-selected="true"
      data-tab="tab-1"
    >
      タブ1
    </button>
    <button
      class="tab-slide-highlight__tab js-tab-slide-highlight-tab"
      type="button"
      role="tab"
      aria-selected="false"
      tabindex="-1"
      data-tab="tab-2"
    >
      タブ2
    </button>
    <button
      class="tab-slide-highlight__tab js-tab-slide-highlight-tab"
      type="button"
      role="tab"
      aria-selected="false"
      tabindex="-1"
      data-tab="tab-3"
    >
      タブ3
    </button>
  </div>

  <div class="tab-slide-highlight__panels">
    <section
      class="tab-slide-highlight__panel js-tab-slide-highlight-panel tab-slide-highlight__panel--active"
      role="tabpanel"
      data-panel="tab-1"
    >
      <p class="tab-slide-highlight__text">
        タブ1のコンテンツです。ここに説明テキストが入ります。
      </p>
    </section>

    <section
      class="tab-slide-highlight__panel js-tab-slide-highlight-panel"
      role="tabpanel"
      data-panel="tab-2"
      hidden
    >
      <p class="tab-slide-highlight__text">
        タブ2のコンテンツです。ここに説明テキストが入ります。
      </p>
    </section>

    <section
      class="tab-slide-highlight__panel js-tab-slide-highlight-panel"
      role="tabpanel"
      data-panel="tab-3"
      hidden
    >
      <p class="tab-slide-highlight__text">
        タブ3のコンテンツです。ここに説明テキストが入ります。
      </p>
    </section>
  </div>
</div>
