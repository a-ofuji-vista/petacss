<header class="header-basic js-header-basic">
  <div class="header-basic__inner">
    <a class="header-basic__logo" href="#" aria-label="トップページ">
      <img
        class="header-basic__logo-image"
        src="/brand/logo.svg"
        alt=""
        width="89"
        height="24"
        decoding="async"
      />
    </a>

    <button
      class="header-basic__toggle js-header-basic-toggle"
      type="button"
      aria-expanded="false"
      aria-label="メニューを開く"
      data-label-open="メニューを開く"
      data-label-close="メニューを閉じる"
    >
      <span class="header-basic__toggle-line" aria-hidden="true"></span>
      <span class="header-basic__toggle-line" aria-hidden="true"></span>
      <span class="header-basic__toggle-line" aria-hidden="true"></span>
    </button>

    <nav
      class="header-basic__nav js-header-basic-nav"
      aria-label="メインメニュー"
    >
      <div class="header-basic__nav-inner">
        <ul class="header-basic__list">
          <li class="header-basic__item">
            <a class="header-basic__link" href="#">Home</a>
          </li>
          <li class="header-basic__item">
            <a class="header-basic__link" href="#">About</a>
          </li>
          <li class="header-basic__item">
            <a class="header-basic__link" href="#">Contact</a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
</header>
